services:
  mc:
    image: itzg/minecraft-server
    environment:
      EULA: "true"
      MEMORY: 26G
      TYPE: PAPER
      PAPER_CHANNEL: DEFAULT
      VERSION: 1.21.1
      ENABLE_WHITELIST: true
      WHITELIST: '${WHITELIST}'
      RCON_PASSWORD: '${RCON_PWD}'
      USE_AIKAR_FLAGS: true
      DIFFICULTY: HARD
      MAX_PLAYERS: 200
      ALLOW_NETHER: false
      SPAWN_PROTECTION: 2
      VIEW_DISTANCE: 16
    ports:
      - "25565:25565"
      - "24454:24454/udp"
    volumes:
      - /home/MinecraftServer:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
volumes:
  data: {}
